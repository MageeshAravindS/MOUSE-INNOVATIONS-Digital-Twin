<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Robot Antennas / Ears -->
  <path d="M18 19 L13 13" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="12" cy="12" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <path d="M46 19 L51 13" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="52" cy="12" r="2.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Robot Outer Head Shell -->
  <rect x="14" y="18" width="36" height="28" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />

  <!-- Dark Visor Display Screen -->
  <rect x="18" y="22" width="28" height="20" rx="6" fill="url(#visorGrad)" />

  <!-- Glowing Cyan Robot Eyes (Mouse Innovations Signature) -->
  <ellipse cx="25" cy="31" rx="3.5" ry="4.5" fill="url(#glowCyan)" filter="url(#glow)" />
  <circle cx="26" cy="30" r="1.2" fill="#ffffff" />

  <ellipse cx="39" cy="31" rx="3.5" ry="4.5" fill="url(#glowCyan)" filter="url(#glow)" />
  <circle cx="40" cy="30" r="1.2" fill="#ffffff" />

  <!-- Digital Smile / Frequency Waves -->
  <path d="M28 38 Q32 40 36 38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Neck Collar / Chassis -->
  <path d="M24 49 L40 49 L37 54 L27 54 Z" fill="#93c5fd" />
  <circle cx="29" cy="51.5" r="1" fill="#1e3a8a" />
  <circle cx="35" cy="51.5" r="1" fill="#1e3a8a" />
</svg>
